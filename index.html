<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>#NULLSEC SECURE P2P</title>
    <style>
        :root {
            --bg-color: #030712;
            --card-bg: #0b1120;
            --accent-color: #00ffcc;
            --accent-dim: rgba(0, 255, 204, 0.15);
            --text-main: #f3f4f6;
            --text-muted: #6b7280;
            --border-color: #1f2937;
            --font-mono: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .app-wrapper {
            width: 100%;
            max-width: 520px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            overflow: hidden;
        }

        .app-header {
            background-color: rgba(15, 23, 42, 0.8);
            border-bottom: 1px solid var(--border-color);
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-title {
            font-family: var(--font-mono);
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--accent-color);
            letter-spacing: 2px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            color: var(--accent-color);
            background: var(--accent-dim);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(0, 255, 204, 0.3);
            font-family: var(--font-mono);
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-color);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-color);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.2; }
            100% { opacity: 1; }
        }

        .app-body {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .code-section {
            background-color: #020617;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .section-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-family: var(--font-mono);
        }

        .code-display {
            font-family: var(--font-mono);
            font-size: 2.8rem;
            font-weight: 800;
            color: var(--accent-color);
            letter-spacing: 6px;
            margin-bottom: 4px;
            text-shadow: 0 0 12px rgba(0, 255, 204, 0.3);
        }

        .vpn-box {
            background-color: #020617;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            font-family: var(--font-mono);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .vpn-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .vpn-title {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .vpn-ip {
            font-size: 1.1rem;
            color: var(--accent-color);
            font-weight: bold;
        }

        .vpn-node {
            font-size: 0.8rem;
            color: #9ca3af;
        }

        .action-button {
            width: 100%;
            background-color: var(--accent-color);
            color: #000000;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 700;
            font-family: var(--font-mono);
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .action-button:hover {
            opacity: 0.9;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
        }

        .terminal-box {
            background-color: #020617;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: #9ca3af;
            height: 100px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .log-entry {
            display: flex;
            gap: 8px;
        }

        .log-time {
            color: var(--accent-color);
        }

        .app-footer {
            border-top: 1px solid var(--border-color);
            padding: 16px 24px;
            background-color: rgba(15, 23, 42, 0.4);
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            font-family: var(--font-mono);
        }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <header class="app-header">
            <div class="brand-title">NULLSEC</div>
            <div class="status-badge">
                <div class="pulse-dot"></div>
                P2P ACTIVE
            </div>
        </header>

        <main class="app-body">
            <section class="code-section">
                <div class="section-label">Session Access Code</div>
                <div class="code-display" id="codeSlot">-----</div>
            </section>

            <!-- VPN MODUL -->
            <div class="vpn-box">
                <div class="vpn-info">
                    <div class="vpn-title">DYNAMIC VPN ROUTE (AUTO 5S)</div>
                    <div class="vpn-ip" id="vpnIp">---.---.---.---</div>
                </div>
                <div class="vpn-node" id="vpnNode">NODE: INIT</div>
            </div>

            <button class="action-button" onclick="generateNewCode()">
                Code Generieren
            </button>

            <div class="terminal-box" id="terminalLog">
                <div class="log-entry">
                    <span class="log-time">[SYSTEM]</span>
                    <span>NULLSEC protocol initialized.</span>
                </div>
            </div>
        </main>

        <footer class="app-footer">
            #NULLSEC NETWORK • NO LOCAL DATA STORED
        </footer>
    </div>

    <script>
        // Speicher blockieren
        try {
            window.localStorage.clear();
            window.sessionStorage.clear();
            Storage.prototype.setItem = function() {};
        } catch(e) {}

        const nodes = ["Frankfurt", "Zurich", "Amsterdam", "Stockholm", "Reykjavik", "Tokyo", "Singapore"];

        function getFormattedTime() {
            const now = new Date();
            return `[${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}]`;
        }

        function addTerminalLog(message) {
            const logContainer = document.getElementById('terminalLog');
            const logEntry = document.createElement('div');
            logEntry.className = 'log-entry';
            logEntry.innerHTML = `<span class="log-time">${getFormattedTime()}</span><span>${message}</span>`;
            logContainer.appendChild(logEntry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        function generateNewCode() {
            const numericCode = Math.floor(10000 + Math.random() * 90000);
            document.getElementById('codeSlot').innerText = numericCode;
            addTerminalLog(`New Session Code: ${numericCode}`);
        }

        // Automatischer VPN-Wechsel alle 5 Sekunden
        function rotateVpn() {
            const randomIp = `${Math.floor(Math.random() * 150 + 40)}.${Math.floor(Math.random() * 255)}.${Math.floor(Math.random() * 255)}.${Math.floor(Math.random() * 255)}`;
            const randomNode = nodes[Math.floor(Math.random() * nodes.length)];

            document.getElementById('vpnIp').innerText = randomIp;
            document.getElementById('vpnNode').innerText = `NODE: ${randomNode.toUpperCase()}`;
            addTerminalLog(`VPN Route Changed -> IP: ${randomIp} (${randomNode})`);
        }

        window.addEventListener('DOMContentLoaded', () => {
            generateNewCode();
            rotateVpn();
            // Startet den 5-Sekunden-Timer für den VPN-Wechsel
            setInterval(rotateVpn, 5000);
        });
    </script>
</body>
</html>
