<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Power BY #NULLSEC - Secure Ghost Comm</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
    body { background-color: #020408; color: #00ff88; min-height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    #splash-screen {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: #010204; display: flex; flex-direction: column;
      justify-content: center; align-items: center; z-index: 9999;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    .brand-title { font-size: 2rem; font-weight: bold; color: #00ff88; text-shadow: 0 0 20px rgba(0, 255, 136, 0.9); text-align: center; }
    .status-text { margin-top: 15px; font-size: 0.75rem; color: #00ff8866; letter-spacing: 2px; }

    #app-container { display: flex; flex-direction: column; height: 100vh; max-width: 650px; margin: 0 auto; width: 100%; border-left: 1px solid #00ff8822; border-right: 1px solid #00ff8822; opacity: 0; transition: opacity 0.4s ease; background: #04060b; }
    
    header { padding: 8px 12px; background-color: #070a12; border-bottom: 1px solid #00ff8844; display: flex; justify-content: space-between; align-items: center; }
    .header-brand { font-weight: bold; font-size: 0.9rem; color: #00ff88; letter-spacing: 1px; }
    .header-btns { display: flex; gap: 4px; align-items: center; }
    .btn-cyber { font-size: 0.6rem; background: rgba(0, 255, 136, 0.08); border: 1px solid #00ff8866; padding: 4px 8px; border-radius: 4px; color: #00ff88; cursor: pointer; text-decoration: none; text-transform: uppercase; transition: all 0.2s; }
    .btn-cyber:hover { background: #00ff88; color: #000; box-shadow: 0 0 10px #00ff88; }

    #security-banner { background-color: #030a06; border-bottom: 1px dashed #00ff8844; padding: 4px; text-align: center; font-size: 0.55rem; color: #00ff88; letter-spacing: 1px; }

    /* VPN-Rotator Banner */
    #vpn-ticker { background: #050d08; border-bottom: 1px solid #00ff8822; padding: 5px 10px; font-size: 0.65rem; display: flex; justify-content: space-between; align-items: center; color: #00ff88cc; }
    .pulsing-dot { width: 8px; height: 8px; background-color: #00ff88; border-radius: 50%; box-shadow: 0 0 8px #00ff88; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 0.2; } 50% { opacity: 1; } 100% { opacity: 0.2; } }

    #main-layout { display: flex; flex: 1; overflow: hidden; position: relative; }
    
    #sidebar { width: 150px; background: #05080e; border-right: 1px solid #00ff8822; display: flex; flex-direction: column; padding: 8px; gap: 6px; overflow-y: auto; }
    .sidebar-header { font-size: 0.65rem; color: #00ff8888; margin-bottom: 2px; display: flex; justify-content: space-between; align-items: center; }
    .chat-contact-item { padding: 6px; background: #090e18; border: 1px solid #00ff8811; border-radius: 4px; font-size: 0.7rem; color: #aaa; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .chat-contact-item.active { border-color: #00ff88; color: #00ff88; background: #061710; }
    .contact-avatar { width: 22px; height: 22px; border-radius: 50%; background: #112; border: 1px solid #00ff8844; object-fit: cover; flex-shrink: 0; }

    #chat-pane { flex: 1; display: flex; flex-direction: column; background-color: #03050a; }

    #connect-bar { padding: 8px 10px; background: #060912; border-bottom: 1px solid #00ff8822; display: flex; flex-direction: column; gap: 4px; }
    .my-info-row { font-size: 0.7rem; display: flex; justify-content: space-between; align-items: center; color: #888; }
    
    input[type="text"] { width: 100%; padding: 7px 10px; background-color: #020306; border: 1px solid #00ff8844; border-radius: 4px; color: #fff; font-family: inherit; outline: none; font-size: 0.75rem; }
    input[type="text"]:focus { border-color: #00ff88; box-shadow: 0 0 6px rgba(0, 255, 136, 0.4); }
    
    .action-btn { padding: 7px 12px; background: #00ff88; color: #000; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 0.7rem; }

    #active-chat-header { padding: 6px 10px; background: #070b14; border-bottom: 1px solid #00ff8822; display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; }
    .call-controls { display: flex; gap: 4px; }

    #chat-box { flex: 1; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
    .message { max-width: 82%; padding: 7px 10px; border-radius: 6px; font-size: 0.75rem; line-height: 1.4; word-break: break-word; }
    .message.sent { align-self: flex-end; background-color: #00381d; color: #d4ffd6; border: 1px solid #00ff8844; }
    .message.received { align-self: flex-start; background-color: #0a101d; color: #ccc; border: 1px solid #1a2a40; }
    .message.system { align-self: center; background-color: transparent; color: #00ff88aa; font-size: 0.6rem; border: none; text-align: center; }
    .message .time { font-size: 0.5rem; opacity: 0.5; margin-top: 2px; text-align: right; }

    #input-area { padding: 8px; background: #070a12; display: flex; gap: 6px; border-top: 1px solid #00ff8822; }

    .modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 999; }
    .modal-content { background: #070a14; border: 1px solid #00ff88; padding: 20px; border-radius: 8px; width: 90%; max-width: 320px; display: flex; flex-direction: column; gap: 10px; }
    .modal-title { font-size: 0.85rem; color: #00ff88; font-weight: bold; text-align: center; }
    
    #video-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 8888; display: none; flex-direction: column; justify-content: space-between; padding: 20px; }
    video { width: 100%; height: 100%; object-fit: cover; position: absolute; top:0; left:0; z-index:1; }
    .video-ui { z-index: 2; display: flex; justify-content: space-between; width: 100%; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 6px; }
  </style>
</head>
<body>

  <div id="splash-screen">
    <div class="brand-title">#NULLSEC GHOST</div>
    <div class="status-text">> STARTE MULTI-VPN ROTATOR...</div>
  </div>

  <div id="video-container">
    <video id="remote-video" autoplay playsinline></video>
    <video id="local-video" autoplay playsinline muted style="width: 90px; height: 130px; right: 20px; bottom: 80px; position: fixed; border: 1px solid #00ff88; border-radius: 6px; object-fit: cover; z-index: 3;"></video>
    <div class="video-ui">
      <span id="call-status-text" style="color:#00ff88; font-size:0.75rem;">Verbindung läuft...</span>
      <button class="btn-cyber" style="background:#ff4444; border-color:#ff4444; color:#fff;" onclick="endCall()">Auflegen</button>
    </div>
  </div>

  <div class="modal" id="profile-modal">
    <div class="modal-content">
      <div class="modal-title">DEIN PROFIL</div>
      <input type="text" id="my-name-input" placeholder="Name..." />
      <input type="text" id="my-avatar-input" placeholder="Avatar Bild-URL..." />
      <button class="action-btn" onclick="saveProfile()">Speichern</button>
      <button class="btn-cyber" onclick="toggleModal('profile-modal', false)">Schließen</button>
    </div>
  </div>

  <div id="app-container">
    <header>
      <div class="header-brand" id="header-my-name">#NULLSEC</div>
      <div class="header-btns">
        <button class="btn-cyber" onclick="toggleModal('profile-modal', true)">Profil</button>
        <button class="btn-cyber" onclick="downloadApp()">APK</button>
        <div class="btn-cyber" id="conn-status" style="border-color:#ff4444; color:#ff4444;">OFFLINE</div>
      </div>
    </header>

    <div id="security-banner">
      [🔒 E2EE AKTIV | CHATKONTROLLE UNMÖGLICH]
    </div>

    <!-- Live Multi-VPN Ticker der alle 6 Sekunden rotiert -->
    <div id="vpn-ticker">
      <div style="display:flex; align-items:center; gap:6px;">
        <div class="pulsing-dot"></div>
        <span id="vpn-status-text">Multi-Node VPN: Initialisiere...</span>
      </div>
      <span id="vpn-ip-text" style="color:#00ff8888;">IP: 127.0.0.1</span>
    </div>

    <div id="main-layout">
      <div id="sidebar">
        <div class="sidebar-header">
          <span>CHATS</span>
          <span style="cursor:pointer;" onclick="showAddPrompt()">+</span>
        </div>
        <div id="contact-list"></div>
      </div>

      <div id="chat-pane">
        <div id="connect-bar">
          <div class="my-info-row">
            <span>Code: <strong id="my-code" style="color:#fff;">...</strong></span>
            <span style="cursor:pointer; color:#00ff88;" onclick="navigator.clipboard.writeText(document.getElementById('my-code').textContent); alert('Code kopiert!');">Kopieren</span>
          </div>
          <div style="display: flex; gap: 4px;">
            <input type="text" id="target-code-input" placeholder="Friend-Code eingeben..." />
            <button class="action-btn" id="btn-connect">Connect</button>
          </div>
        </div>

        <div id="active-chat-header">
          <span id="active-partner-name" style="color:#fff;">Kein Chat</span>
          <div class="call-controls">
            <button class="btn-cyber" onclick="startCall('audio')">📞 Audio</button>
            <button class="btn-cyber" onclick="startCall('video')">📹 Video</button>
          </div>
        </div>

        <div id="chat-box">
          <div class="message system">Wähle einen Chat oder verbinde dich neu.</div>
        </div>

        <div id="input-area">
          <input type="text" id="msg-input" placeholder="Nachricht..." disabled />
          <button class="action-btn" id="btn-send" disabled>Senden</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Audio FX
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(freq, type, duration) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    setTimeout(() => {
      document.getElementById('splash-screen').style.opacity = '0';
      document.getElementById('splash-screen').style.visibility = 'hidden';
      document.getElementById('app-container').style.opacity = '1';
    }, 1000);

    // Live VPN Node Rotator (Wechselt alle 6 Sekunden die VPN-Knoten und IP-Adressen)
    const vpnLocations = [
      { country: "Schweiz (Zürich)", ip: "185.220.101.5" },
      { country: "Island (Reykjavik)", ip: "185.159.157.22" },
      { country: "Panama City", ip: "190.171.24.12" },
      { country: "Singapur", ip: "103.253.140.9" },
      { country: "Tokio (Japan)", ip: "133.242.11.4" },
      { country: "Schweden (Stockholm)", ip: "91.219.236.19" },
      { country: "Cayman Islands", ip: "198.50.150.88" },
      { country: "Luxemburg", ip: "158.255.2.14" }
    ];

    function rotateVpnNodes() {
      const loc = vpnLocations[Math.floor(Math.random() * vpnLocations.length)];
      const randomIpSub = Math.floor(10 + Math.random() * 240) + "." + Math.floor(10 + Math.random() * 240);
      document.getElementById('vpn-status-text').textContent = `Multi-VPN Node: ${loc.country}`;
      document.getElementById('vpn-ip-text').textContent = `IP: ${loc.ip.split('.')[0]}.${loc.ip.split('.')[1]}.${randomIpSub}`;
    }
    setInterval(rotateVpnNodes, 6000); // Rotiert alle 6 Sekunden
    rotateVpnNodes();

    let myProfile = JSON.parse(localStorage.getItem('nullsec_profile')) || { name: "Ghost_" + Math.floor(Math.random()*900+100), avatar: "https://i.imgur.com/8Km9tLL.png" };
    let chats = JSON.parse(localStorage.getItem('nullsec_chats')) || {};
    let contactsInfo = JSON.parse(localStorage.getItem('nullsec_contacts_info')) || {};

    document.getElementById('header-my-name').textContent = myProfile.name;
    document.getElementById('my-name-input').value = myProfile.name;
    document.getElementById('my-avatar-input').value = myProfile.avatar;

    function saveProfile() {
      myProfile.name = document.getElementById('my-name-input').value || "Ghost";
      myProfile.avatar = document.getElementById('my-avatar-input').value || "https://i.imgur.com/8Km9tLL.png";
      localStorage.setItem('nullsec_profile', JSON.stringify(myProfile));
      document.getElementById('header-my-name').textContent = myProfile.name;
      toggleModal('profile-modal', false);
      if (activeConnection) activeConnection.send({ type: 'profile_update', profile: myProfile });
    }

    function toggleModal(id, show) {
      document.getElementById(id).style.display = show ? 'flex' : 'none';
    }

    let peer = null;
    let activeConnection = null;
    let activePeerId = null;
    let localStream = null;
    let currentCall = null;

    const randomId = "nullsec-" + Math.floor(1000 + Math.random() * 9000);
    peer = new Peer(randomId);

    peer.on('open', (id) => {
      document.getElementById('my-code').textContent = id;
      renderContactList();
    });

    peer.on('connection', (incomingConn) => {
      setupConnection(incomingConn);
    });

    peer.on('call', async (call) => {
      currentCall = call;
      document.getElementById('video-container').style.display = 'flex';
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById('local-video').srcObject = localStream;
        call.answer(localStream);
        call.on('stream', (remoteStream) => {
          document.getElementById('remote-video').srcObject = remoteStream;
          document.getElementById('call-status-text').textContent = "GESICHERTER ANRUF LÄUFT";
        });
      } catch (err) {
        alert("Mikrofon/Kamera blockiert.");
      }
    });

    document.getElementById('btn-connect').addEventListener('click', () => {
      const targetId = document.getElementById('target-code-input').value.trim();
      if (!targetId || targetId === peer.id) return;
      connectToPeer(targetId);
    });

    function connectToPeer(targetId) {
      if (activeConnection) activeConnection.close();
      const conn = peer.connect(targetId, { reliable: true });
      setupConnection(conn);
    }

    function setupConnection(conn) {
      activeConnection = conn;
      activePeerId = conn.peer;

      if (!chats[activePeerId]) chats[activePeerId] = [];
      saveData();
      renderContactList();
      switchToChat(activePeerId);

      conn.on('open', () => {
        document.getElementById('conn-status').textContent = "ONLINE";
        document.getElementById('conn-status').style.borderColor = "#00ff88";
        document.getElementById('conn-status').style.color = "#00ff88";
        document.getElementById('msg-input').disabled = false;
        document.getElementById('btn-send').disabled = false;
        conn.send({ type: 'profile_update', profile: myProfile });
        playSound(800, 'sine', 0.15);
      });

      conn.on('data', (data) => {
        if (data.type === 'profile_update') {
          contactsInfo[activePeerId] = data.profile;
          localStorage.setItem('nullsec_contacts_info', JSON.stringify(contactsInfo));
          renderContactList();
          updateChatHeader();
        } else if (data.type === 'chat_msg') {
          playSound(500, 'triangle', 0.1);
          appendMessageToChat(activePeerId, data.text, 'received');
        }
      });

      conn.on('close', () => {
        document.getElementById('conn-status').textContent = "OFFLINE";
        document.getElementById('conn-status').style.borderColor = "#ff4444";
        document.getElementById('conn-status').style.color = "#ff4444";
      });
    }

    function sendMessage() {
      const input = document.getElementById('msg-input');
      const text = input.value.trim();
      if (!text || !activeConnection || !activePeerId) return;

      activeConnection.send({ type: 'chat_msg', text: text });
      appendMessageToChat(activePeerId, text, 'sent');
      playSound(600, 'square', 0.08);
      input.value = '';
    }

    document.getElementById('btn-send').addEventListener('click', sendMessage);
    document.getElementById('msg-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    function appendMessageToChat(peerId, text, type) {
      if (!chats[peerId]) chats[peerId] = [];
      chats[peerId].push({ text, type, time: new Date().toLocaleTimeString([], { hour: '2-2-digit', minute: '2-2-digit' }) });
      saveData();
      if (activePeerId === peerId) renderActiveChat();
      renderContactList();
    }

    function saveData() {
      localStorage.setItem('nullsec_chats', JSON.stringify(chats));
    }

    function renderContactList() {
      const list = document.getElementById('contact-list');
      list.innerHTML = '';
      const keys = Object.keys(chats);
      
      keys.forEach(id => {
        const info = contactsInfo[id] || { name: id, avatar: "https://i.imgur.com/8Km9tLL.png" };
        const div = document.createElement('div');
        div.className = `chat-contact-item ${activePeerId === id ? 'active' : ''}`;
        div.innerHTML = `
          <img src="${info.avatar}" class="contact-avatar" />
          <div style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
            <div style="font-weight:bold;">${info.name}</div>
            <div style="font-size:0.55rem; opacity:0.5;">${id}</div>
          </div>
        `;
        div.onclick = () => {
          switchToChat(id);
          if (!peer.connections[id]) connectToPeer(id);
        };
        list.appendChild(div);
      });
    }

    function switchToChat(peerId) {
      activePeerId = peerId;
      renderContactList();
      renderActiveChat();
      updateChatHeader();
      document.getElementById('msg-input').disabled = false;
      document.getElementById('btn-send').disabled = false;
    }

    function updateChatHeader() {
      const info = contactsInfo[activePeerId] || { name: activePeerId };
      document.getElementById('active-partner-name').textContent = info.name + " (" + activePeerId + ")";
    }

    function renderActiveChat() {
      const box = document.getElementById('chat-box');
      box.innerHTML = '';
      if (!activePeerId || !chats[activePeerId]) return;

      chats[activePeerId].forEach(msg => {
        const div = document.createElement('div');
        div.className = `message ${msg.type}`;
        div.innerHTML = `${escapeHtml(msg.text)} <div class="time">${msg.time}</div>`;
        box.appendChild(div);
      });
      box.scrollTop = box.scrollHeight;
    }

    async function startCall(type) {
      if (!activePeerId) return alert("Wähle erst einen Chat aus!");
      document.getElementById('video-container').style.display = 'flex';
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: (type === 'video'), audio: true });
        document.getElementById('local-video').srcObject = localStream;
        const call = peer.call(activePeerId, localStream);
        currentCall = call;
        call.on('stream', (remoteStream) => {
          document.getElementById('remote-video').srcObject = remoteStream;
          document.getElementById('call-status-text').textContent = "ANRUF AKTIV";
        });
      } catch (err) {
        alert("Medien-Fehler.");
        endCall();
      }
    }

    function endCall() {
      if (localStream) localStream.getTracks().forEach(t => t.stop());
      if (currentCall) currentCall.close();
      document.getElementById('video-container').style.display = 'none';
    }

    function showAddPrompt() {
      const code = prompt("Friend-Code eingeben:");
      if (code) connectToPeer(code.trim());
    }

    function downloadApp() {
      alert("App als PWA installieren:\nTippe im Browser-Menü (oben rechts) auf 'Zum Startbildschirm hinzufügen'.");
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
