<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Power BY #NULLSEC - Encrypted Messenger</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Courier New', Courier, monospace;
    }

    body {
      background-color: #050508;
      color: #00ff88;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 1. START-ANIMATION (SPLASH SCREEN & GLITCH) */
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #020203;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 999;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    .brand-title {
      font-size: 2.2rem;
      font-weight: bold;
      color: #00ff88;
      text-shadow: 0 0 15px rgba(0, 255, 136, 0.8), 0 0 35px rgba(0, 255, 136, 0.5);
      letter-spacing: 2px;
      position: relative;
      text-align: center;
      padding: 0 20px;
    }

    /* Cyberpunk Glitch Effect */
    .brand-title::before, .brand-title::after {
      content: "Power BY #NULLSEC";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      clip: rect(0, 0, 0, 0);
    }

    .brand-title::before {
      left: 2px;
      text-shadow: -2px 0 #ff0055;
      animation: glitch-anim-1 2s infinite linear alternate-reverse;
    }

    .brand-title::after {
      left: -2px;
      text-shadow: -2px 0 #00e5ff;
      animation: glitch-anim-2 3s infinite linear alternate-reverse;
    }

    @keyframes glitch-anim-1 {
      0% { clip: rect(20px, 9999px, 15px, 0); }
      20% { clip: rect(42px, 9999px, 78px, 0); }
      40% { clip: rect(10px, 9999px, 85px, 0); }
      60% { clip: rect(65px, 9999px, 30px, 0); }
      80% { clip: rect(80px, 9999px, 5px, 0); }
      100% { clip: rect(5px, 9999px, 60px, 0); }
    }

    @keyframes glitch-anim-2 {
      0% { clip: rect(75px, 9999px, 10px, 0); }
      25% { clip: rect(15px, 9999px, 55px, 0); }
      50% { clip: rect(50px, 9999px, 35px, 0); }
      75% { clip: rect(90px, 9999px, 20px, 0); }
      100% { clip: rect(30px, 9999px, 70px, 0); }
    }

    .status-text {
      margin-top: 20px;
      font-size: 0.85rem;
      color: #888;
      letter-spacing: 1px;
    }

    /* 2. HAUPTOBERFLÄCHE */
    #app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
      border-left: 1px solid #112211;
      border-right: 1px solid #112211;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    header {
      padding: 15px;
      background-color: #0a0d12;
      border-bottom: 1px solid #00ff8833;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-brand {
      font-weight: bold;
      font-size: 1.1rem;
      color: #00ff88;
    }

    .badge-vpn {
      font-size: 0.75rem;
      background: rgba(0, 255, 136, 0.1);
      border: 1px solid #00ff88;
      padding: 3px 8px;
      border-radius: 4px;
      color: #00ff88;
    }

    #connect-screen {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      background: #080a0f;
      border-bottom: 1px solid #112211;
    }

    .my-code-box {
      background: #0d121c;
      padding: 10px;
      border: 1px dashed #00ff8866;
      border-radius: 6px;
      font-size: 0.9rem;
      display: flex;
      justify-content: space-between;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      background-color: #05070a;
      border: 1px solid #00ff8844;
      border-radius: 6px;
      color: #fff;
      font-family: inherit;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #00ff88;
      box-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
    }

    button {
      padding: 12px;
      background: #00ff88;
      color: #000;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s ease;
    }

    button:active {
      transform: scale(0.98);
      background: #00cc6c;
    }

    #chat-box {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background-color: #040507;
    }

    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      line-height: 1.4;
      word-break: break-word;
    }

    .message.sent {
      align-self: flex-end;
      background-color: #004d28;
      color: #e0ffe0;
      border: 1px solid #00ff8844;
    }

    .message.received {
      align-self: flex-start;
      background-color: #0f1520;
      color: #aaa;
      border: 1px solid #223344;
    }

    .message .time {
      font-size: 0.65rem;
      opacity: 0.5;
      margin-top: 4px;
      text-align: right;
    }

    #input-area {
      padding: 15px;
      background-color: #0a0d12;
      display: flex;
      gap: 10px;
      border-top: 1px solid #112211;
    }
  </style>
</head>
<body>

  <!-- SPLASH SCREEN ANIMATION -->
  <div id="splash-screen">
    <div class="brand-title">Power BY #NULLSEC</div>
    <div class="status-text" id="status-text">> Initialisiere Anonymitäts-Protokolle...</div>
  </div>

  <!-- HAUPTOBERFLÄCHE -->
  <div id="app-container">
    <header>
      <div class="header-brand">Power BY #NULLSEC</div>
      <div class="badge-vpn">PROXIED / NO-LOGS</div>
    </header>

    <div id="connect-screen">
      <div class="my-code-box">
        <span>Dein Friend-Code:</span>
        <strong id="my-code">...</strong>
      </div>

      <div style="display: flex; gap: 8px;">
        <input type="text" id="target-code-input" placeholder="Friend-Code eingeben (z.B. NULL-8291)" />
        <button id="btn-connect">Verbinden</button>
      </div>
    </div>

    <div id="chat-box">
      <div class="message received">
        Verbindung bereit. Gib oben den Code deines Kontakts ein, um einen privaten Tunnel zu starten.
        <div class="time">SYSTEM</div>
      </div>
    </div>

    <div id="input-area">
      <input type="text" id="msg-input" placeholder="Anonyme Nachricht schreiben..." />
      <button id="btn-send">Senden</button>
    </div>
  </div>

  <script>
    // Audio-Effekte über Web Audio API
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(freq, type, duration) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    // Friend-Code Generierung
    function generateFriendCode() {
      const rand = Math.floor(1000 + Math.random() * 9000);
      return `NULL-${rand}`;
    }

    document.getElementById('my-code').textContent = generateFriendCode();

    // Timer & Sounds für Splash Screen
    const splashScreen = document.getElementById('splash-screen');
    const appContainer = document.getElementById('app-container');
    const statusText = document.getElementById('status-text');

    setTimeout(() => {
      statusText.textContent = "> Verbindung verschlüsselt. Tunnel bereit.";
      playSound(800, 'sine', 0.1);
    }, 1200);

    setTimeout(() => {
      splashScreen.style.opacity = '0';
      splashScreen.style.visibility = 'hidden';
      appContainer.style.opacity = '1';
      playSound(440, 'triangle', 0.2);
    }, 2500);

    // Chat-Logik
    const chatBox = document.getElementById('chat-box');
    const msgInput = document.getElementById('msg-input');
    const btnSend = document.getElementById('btn-send');

    function sendMessage() {
      const text = msgInput.value.trim();
      if (!text) return;

      playSound(600, 'square', 0.08);

      const timeStr = new Date().toLocaleTimeString([], { hour: '2-2-digit', minute: '2-2-digit' });
      const msgDiv = document.createElement('div');
      msgDiv.className = 'message sent';
      msgDiv.innerHTML = `${escapeHtml(text)} <div class="time">${timeStr}</div>`;
      
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
      msgInput.value = '';
    }

    btnSend.addEventListener('click', sendMessage);
    msgInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
