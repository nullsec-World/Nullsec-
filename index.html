<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Power BY #NULLSEC - Encrypted Messenger</title>
  <!-- PeerJS Library für echte P2P-Verbindung -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
    body { background-color: #050508; color: #00ff88; min-height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    #splash-screen {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: #020203; display: flex; flex-direction: column;
      justify-content: center; align-items: center; z-index: 999;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }
    .brand-title {
      font-size: 2.2rem; font-weight: bold; color: #00ff88;
      text-shadow: 0 0 15px rgba(0, 255, 136, 0.8); text-align: center; padding: 0 20px;
    }
    .status-text { margin-top: 20px; font-size: 0.85rem; color: #888; }

    #app-container {
      display: flex; flex-direction: column; height: 100vh; max-width: 600px;
      margin: 0 auto; width: 100%; border-left: 1px solid #112211; border-right: 1px solid #112211;
      opacity: 0; transition: opacity 0.5s ease;
    }
    header { padding: 15px; background-color: #0a0d12; border-bottom: 1px solid #00ff8833; display: flex; justify-content: space-between; align-items: center; }
    .header-brand { font-weight: bold; font-size: 1.1rem; color: #00ff88; }
    .badge-vpn { font-size: 0.75rem; background: rgba(0, 255, 136, 0.1); border: 1px solid #00ff88; padding: 3px 8px; border-radius: 4px; color: #00ff88; }

    #connect-screen { padding: 20px; display: flex; flex-direction: column; gap: 15px; background: #080a0f; border-bottom: 1px solid #112211; }
    .my-code-box { background: #0d121c; padding: 10px; border: 1px dashed #00ff8866; border-radius: 6px; font-size: 0.9rem; display: flex; justify-content: space-between; align-items: center; }
    
    input[type="text"] { width: 100%; padding: 12px; background-color: #05070a; border: 1px solid #00ff8844; border-radius: 6px; color: #fff; font-family: inherit; outline: none; }
    input[type="text"]:focus { border-color: #00ff88; box-shadow: 0 0 10px rgba(0, 255, 136, 0.3); }
    button { padding: 12px; background: #00ff88; color: #000; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; font-family: inherit; }

    #chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background-color: #040507; }
    .message { max-width: 80%; padding: 10px 14px; border-radius: 8px; font-size: 0.9rem; line-height: 1.4; word-break: break-word; }
    .message.sent { align-self: flex-end; background-color: #004d28; color: #e0ffe0; border: 1px solid #00ff8844; }
    .message.received { align-self: flex-start; background-color: #0f1520; color: #aaa; border: 1px solid #223344; }
    .message.system { align-self: center; background-color: transparent; color: #00ff88; font-size: 0.75rem; border: none; }
    .message .time { font-size: 0.65rem; opacity: 0.5; margin-top: 4px; text-align: right; }

    #input-area { padding: 15px; background-color: #0a0d12; display: flex; gap: 10px; border-top: 1px solid #112211; }
  </style>
</head>
<body>

  <div id="splash-screen">
    <div class="brand-title">Power BY #NULLSEC</div>
    <div class="status-text" id="status-text">> Verbinde mit P2P Network...</div>
  </div>

  <div id="app-container">
    <header>
      <div class="header-brand">Power BY #NULLSEC</div>
      <div class="badge-vpn" id="conn-status">DISCONNECTED</div>
    </header>

    <div id="connect-screen">
      <div class="my-code-box">
        <span>Dein Code:</span>
        <strong id="my-code" style="color: #fff;">Generiere...</strong>
      </div>
      <div style="display: flex; gap: 8px;">
        <input type="text" id="target-code-input" placeholder="Friend-Code eingeben..." />
        <button id="btn-connect">Verbinden</button>
      </div>
    </div>

    <div id="chat-box">
      <div class="message system">Warte auf P2P-Initialisierung...</div>
    </div>

    <div id="input-area">
      <input type="text" id="msg-input" placeholder="Anonyme Nachricht..." disabled />
      <button id="btn-send" disabled>Senden</button>
    </div>
  </div>

  <script>
    // Audio FX
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(freq, type, duration) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    // Splash animation
    setTimeout(() => {
      document.getElementById('splash-screen').style.opacity = '0';
      document.getElementById('splash-screen').style.visibility = 'hidden';
      document.getElementById('app-container').style.opacity = '1';
    }, 2000);

    // P2P Logic mit PeerJS
    let peer = null;
    let conn = null;

    // Generiere zufällige 4-stellige ID
    const randomId = "nullsec-" + Math.floor(1000 + Math.random() * 9000);
    peer = new Peer(randomId);

    peer.on('open', (id) => {
      document.getElementById('my-code').textContent = id;
      addSystemMessage("Bereit. Dein Code ist: " + id);
    });

    // Inbound connection (Jemand verbindet sich mit DIR)
    peer.on('connection', (incomingConn) => {
      conn = incomingConn;
      setupChatConnection();
      addSystemMessage("Partner hat sich verbunden!");
    });

    // Outbound connection (DU verbindest dich mit jemandem)
    document.getElementById('btn-connect').addEventListener('click', () => {
      const targetId = document.getElementById('target-code-input').value.trim();
      if (!targetId) return alert("Bitte Code eingeben!");
      
      addSystemMessage("Verbinde mit " + targetId + "...");
      conn = peer.connect(targetId);
      setupChatConnection();
    });

    function setupChatConnection() {
      conn.on('open', () => {
        document.getElementById('conn-status').textContent = "CONNECTED";
        document.getElementById('conn-status').style.borderColor = "#00ff88";
        document.getElementById('msg-input').disabled = false;
        document.getElementById('btn-send').disabled = false;
        playSound(800, 'sine', 0.15);
      });

      conn.on('data', (data) => {
        playSound(500, 'triangle', 0.1);
        appendMessage(data, 'received');
      });

      conn.on('close', () => {
        document.getElementById('conn-status').textContent = "DISCONNECTED";
        addSystemMessage("Verbindung getrennt.");
        document.getElementById('msg-input').disabled = true;
        document.getElementById('btn-send').disabled = true;
      });
    }

    // Nachricht senden
    function sendMessage() {
      const input = document.getElementById('msg-input');
      const text = input.value.trim();
      if (!text || !conn) return;

      conn.send(text);
      appendMessage(text, 'sent');
      playSound(600, 'square', 0.08);
      input.value = '';
    }

    document.getElementById('btn-send').addEventListener('click', sendMessage);
    document.getElementById('msg-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    function appendMessage(text, type) {
      const box = document.getElementById('chat-box');
      const timeStr = new Date().toLocaleTimeString([], { hour: '2-2-digit', minute: '2-2-digit' });
      const div = document.createElement('div');
      div.className = `message ${type}`;
      div.innerHTML = `${escapeHtml(text)} <div class="time">${timeStr}</div>`;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function addSystemMessage(text) {
      const box = document.getElementById('chat-box');
      const div = document.createElement('div');
      div.className = 'message system';
      div.textContent = "> " + text;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
