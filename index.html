<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>#NULLSEC • Instant Direct Chat</title>
    <style>
        :root {
            --bg-dark: #0b141a;
            --panel-bg: #111b21;
            --header-bg: #202c33;
            --neon-green: #00a884;
            --text-main: #e9edef;
            --text-muted: #8696a0;
            --msg-me: #005c4b;
            --msg-peer: #202c33;
            --input-bg: #2a3942;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 600px;
            height: 100%;
            background: var(--panel-bg);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        @media (min-width: 601px) {
            .container {
                height: 94vh;
                border-radius: 16px;
                box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            }
        }

        .header {
            background: var(--header-bg);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .brand {
            font-weight: 900;
            color: var(--neon-green);
            font-size: 1.1rem;
            letter-spacing: 1px;
        }

        .status {
            font-size: 0.7rem;
            color: var(--neon-green);
            background: rgba(0, 168, 132, 0.1);
            padding: 4px 8px;
            border-radius: 10px;
            font-weight: bold;
        }

        .setup-box {
            background: var(--panel-bg);
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .row {
            display: flex;
            gap: 8px;
        }

        input {
            flex: 1;
            background: var(--input-bg);
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
            text-align: center;
        }

        input:focus {
            box-shadow: 0 0 0 1px var(--neon-green);
        }

        .chat-box {
            flex: 1;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 24px 24px;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .msg {
            max-width: 80%;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            line-height: 1.4;
            word-break: break-word;
            position: relative;
        }

        .msg.me {
            background: var(--msg-me);
            align-self: flex-end;
            border-top-right-radius: 0;
        }

        .msg.peer {
            background: var(--msg-peer);
            align-self: flex-start;
            border-top-left-radius: 0;
        }

        .msg.sys {
            background: rgba(255,255,255,0.05);
            color: var(--text-muted);
            align-self: center;
            font-size: 0.75rem;
            text-align: center;
            border-radius: 6px;
            max-width: 95%;
        }

        .time {
            font-size: 0.6rem;
            color: var(--text-muted);
            float: right;
            margin-left: 8px;
            margin-top: 4px;
        }

        .input-bar {
            background: var(--header-bg);
            padding: 10px 16px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .input-bar input {
            border-radius: 20px;
            padding: 12px 18px;
            text-align: left;
        }

        .send-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--neon-green);
            color: #111b21;
            border: none;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.1rem;
            cursor: pointer;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="brand">#NULLSEC INSTANT</div>
        <div class="status" id="statusBadge">BEREIT</div>
    </div>

    <!-- CODE EINGABE (SOFORT AKTIV) -->
    <div class="setup-box">
        <div class="row">
            <input type="text" id="myCode" readonly title="Dein eigener Code">
            <input type="text" id="targetCode" placeholder="Code vom Partner eingeben..." oninput="checkAndConnect()">
        </div>
    </div>

    <div class="chat-box" id="chatBox">
        <div class="msg sys">Dein eigener Code wird generiert. Tippe den Code deines Partners ein und schreibe direkt drauf los!</div>
    </div>

    <div class="input-bar">
        <input type="text" id="msgInput" placeholder="Nachricht schreiben..." onkeypress="if(event.key==='Enter') sendMsg()">
        <button class="send-btn" onclick="sendMsg()">➤</button>
    </div>
</div>

<script>
    // Generiere einen zufälligen 6-stelligen Code für dich selbst
    let myId = Math.floor(100000 + Math.random() * 900000).toString();
    document.getElementById('myCode').value = "MEIN CODE: " + myId;

    let ws = null;
    let activeChannel = "";

    // Öffentlicher Hochgeschwindigkeits-Messaging-Kanal
    function connectToChannel(channelId) {
        if (!channelId || channelId.length !== 6) return;
        
        if (activeChannel === channelId && ws && ws.readyState === WebSocket.OPEN) return;

        if (ws) ws.close();
        activeChannel = channelId;

        // Wir nutzen einen gemeinsamen Raum, der sich aus beiden Codes oder dem Zielcode ergibt, 
        // damit beide Handys exakt denselben Tunnel nutzen.
        // Sortierung garantiert, dass egal wer wen eintippt, derselbe Raum geöffnet wird.
        const roomName = [myId, channelId].sort().join('_');

        ws = new WebSocket(`wss://sockets.space/v1/nullsec_${roomName}`);

        ws.onopen = () => {
            document.getElementById('statusBadge').innerText = "LIVE & VERBUNDEN";
            logSys(`Direkt verbunden mit Kanal #${channelId}! Du kannst schreiben.`);
        };

        ws.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                if (data.sender !== myId && data.text) {
                    addMsg(data.text, 'peer');
                }
            } catch(e) {}
        };

        ws.onerror = () => {
            logSys("⚠️ Verbindung wird gehalten...");
        };
    }

    // Sobald der Partner-Code eingetippt wird (automatisch ab 6 Ziffern), baut sich der Kanal ohne Klick auf
    function checkAndConnect() {
        const val = document.getElementById('targetCode').value.trim();
        if (val.length === 6) {
            connectToChannel(val);
        }
    }

    function sendMsg() {
        const input = document.getElementById('msgInput');
        const text = input.value.trim();
        if (!text) return;

        const target = document.getElementById('targetCode').value.trim();
        if (target.length !== 6) {
            alert("Bitte zuerst den 6-stelligen Code des Partners oben eingeben!");
            return;
        }

        // Sicherstellen, dass die Verbindung steht
        if (!ws || ws.readyState !== WebSocket.OPEN) {
            connectToChannel(target);
        }

        const payload = JSON.stringify({
            sender: myId,
            text: text
        });

        // Sofortiges Senden
        setTimeout(() => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(payload);
            }
        }, 50);

        addMsg(text, 'me');
        input.value = '';
    }

    function addMsg(text, type) {
        const box = document.getElementById('chatBox');
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        
        const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        div.innerHTML = `${text}<span class="time">${time}</span>`;
        
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    function logSys(text) {
        const box = document.getElementById('chatBox');
        const div = document.createElement('div');
        div.className = 'msg sys';
        div.innerText = text;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    // Direkt beim Start eigenen Code ins System laden
    logSys(`Dein Code ist #${myId}. Gib den Code deines Partners ein, um sofort zu starten.`);
</script>

</body>
</html>
