<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>#NULLSEC SECURE P2P</title>
    <style>
        :root {
            --bg-color: #030712;
            --card-bg: #0b1120;
            --accent-color: #00ffcc;
            --accent-dim: rgba(0, 255, 204, 0.15);
            --text-main: #f3f4f6;
            --text-muted: #6b7280;
            --border-color: #1f2937;
            --font-mono: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .app-wrapper {
            width: 100%;
            max-width: 500px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            overflow: hidden;
        }

        .app-header {
            background-color: rgba(15, 23, 42, 0.8);
            border-bottom: 1px solid var(--border-color);
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-title {
            font-family: var(--font-mono);
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--accent-color);
            letter-spacing: 2px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.7rem;
            color: var(--accent-color);
            background: var(--accent-dim);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(0, 255, 204, 0.3);
            font-family: var(--font-mono);
        }

        .app-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .code-section {
            background-color: #020617;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }

        .code-display {
            font-family: var(--font-mono);
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--accent-color);
            letter-spacing: 4px;
        }

        .connect-box {
            display: flex;
            gap: 8px;
        }

        input[type="text"] {
            flex: 1;
            background: #020617;
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 8px;
            color: var(--accent-color);
            font-family: var(--font-mono);
            font-size: 1rem;
            outline: none;
        }

        button {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 12px 16px;
            border-radius: 8px;
            font-weight: 700;
            font-family: var(--font-mono);
            cursor: pointer;
            text-transform: uppercase;
        }

        .call-controls {
            display: flex;
            gap: 10px;
        }

        .btn-call {
            flex: 1;
            background: #10b981;
            color: #fff;
        }

        .btn-hangup {
            flex: 1;
            background: #ef4444;
            color: #fff;
        }

        .chat-box {
            background-color: #020617;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            height: 150px;
            padding: 10px;
            overflow-y: auto;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .chat-msg {
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 10px;
            border-radius: 6px;
        }

        .app-footer {
            border-top: 1px solid var(--border-color);
            padding: 12px;
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-muted);
            font-family: var(--font-mono);
        }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <header class="app-header">
            <div class="brand-title">NULLSEC</div>
            <div class="status-badge">IN-MEMORY ONLY</div>
        </header>

        <main class="app-body">
            <!-- EIGENER CODE -->
            <div class="code-section">
                <div style="font-size: 0.7rem; color: var(--text-muted);">DEIN CODE (ZUM TEILEN)</div>
                <div class="code-display" id="myCode">-----</div>
                <button style="width: 100%; margin-top: 8px;" onclick="generateCode()">Neuen Code Erzeugen</button>
            </div>

            <!-- CODE VOM FREUND EINGEBEN -->
            <div class="connect-box">
                <input type="text" id="friendCode" placeholder="Code vom Freund eingeben..." maxlength="5">
                <button onclick="connectToFriend()">Verbinden</button>
            </div>

            <!-- ANRUF KNÖPFE -->
            <div class="call-controls">
                <button class="btn-call" onclick="startCall()">Anrufen 📞</button>
                <button class="btn-hangup" onclick="endCall()">Auflegen ❌</button>
            </div>

            <!-- CHAT FENSTER -->
            <div class="chat-box" id="chatBox">
                <div class="chat-msg" style="color: var(--text-muted);">System: Bereit für Anruf & Chat. Keine Speicherung.</div>
            </div>

            <!-- NACHRICHT SCHREIBEN -->
            <div class="connect-box">
                <input type="text" id="chatInput" placeholder="Nachricht schreiben...">
                <button onclick="sendMessage()">Senden</button>
            </div>
        </main>

        <footer class="app-footer">
            #NULLSEC P2P NETWORK • ZERO LOGS
        </footer>
    </div>

    <script>
        // Speicher komplett sperren
        try {
            window.localStorage.clear();
            window.sessionStorage.clear();
            Storage.prototype.setItem = function() {};
        } catch(e) {}

        function generateCode() {
            const code = Math.floor(10000 + Math.random() * 90000);
            document.getElementById('myCode').innerText = code;
        }

        function connectToFriend() {
            const code = document.getElementById('friendCode').value;
            if(code.length < 5) {
                alert("Bitte gültigen 5-stelligen Code eingeben!");
                return;
            }
            addChatMsg(`Verbindung wird zu Code ${code} aufgebaut...`);
        }

        function sendMessage() {
            const input = document.getElementById('chatInput');
            if(!input.value) return;
            addChatMsg(`Du: ${input.value}`);
            input.value = '';
        }

        function addChatMsg(text) {
            const box = document.getElementById('chatBox');
            const msg = document.createElement('div');
            msg.className = 'chat-msg';
            msg.innerText = text;
            box.appendChild(msg);
            box.scrollTop = box.scrollHeight;
        }

        function startCall() {
            // Fordert Mikrofonausdauer an für Sprache
            navigator.mediaDevices.getUserMedia({ audio: true })
                .then(stream => {
                    addChatMsg("Mikrofon aktiv. Anruf läuft...");
                })
                .catch(err => {
                    addChatMsg("Mikrofon-Zugriff verweigert.");
                });
        }

        function endCall() {
            addChatMsg("Anruf beendet.");
        }

        window.onload = generateCode;
    </script>
</body>
</html>
