<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>#NULLSEC • WhatsApp Speed Terminal</title>
    
    <!-- Superschnelles Messaging System -->
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        :root {
            --bg-dark: #0b141a;
            --panel-bg: #111b21;
            --neon-green: #00a884;
            --text-main: #e9edef;
            --text-muted: #8696a0;
            --msg-me: #005c4b;
            --msg-peer: #202c33;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .app-container {
            width: 100%;
            max-width: 600px;
            height: 100%;
            background: var(--panel-bg);
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 14px 16px;
            background: #202c33;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .title { color: var(--neon-green); font-weight: 900; letter-spacing: 2px; }

        .control-panel {
            padding: 10px;
            background: #111b21;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .row { display: flex; gap: 8px; }

        input {
            flex: 1;
            background: #2a3942;
            border: none;
            padding: 12px;
            border-radius: 8px;
            color: #fff;
            outline: none;
            font-size: 0.9rem;
        }

        .btn {
            background: var(--neon-green);
            color: #111b21;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        /* RIESIGER WHATSAPP CHAT */
        .chat-box {
            flex: 1;
            background: #0b141a;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .msg {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            word-break: break-word;
            line-height: 1.4;
        }

        .msg.me { background: var(--msg-me); align-self: flex-end; }
        .msg.peer { background: var(--msg-peer); align-self: flex-start; }
        .msg.sys { background: rgba(255,255,255,0.05); color: var(--text-muted); align-self: center; font-size: 0.75rem; }

        .input-bar {
            padding: 12px;
            background: #202c33;
            display: flex;
            gap: 10px;
        }

        .input-bar input { border-radius: 20px; }
        .send-btn { width: 45px; height: 45px; border-radius: 50%; background: var(--neon-green); border: none; font-size: 1.2rem; cursor: pointer; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <div class="title">#NULLSEC MEGA-CHAT</div>
            <div id="status" style="font-size: 0.75rem; color: var(--neon-green);">SOFORT-MODUS</div>
        </div>

        <div class="control-panel">
            <div class="row">
                <input type="text" id="myCode" readonly style="text-align: center; color: var(--neon-green); font-weight: bold;">
                <button class="btn" onclick="copyCode()">KOPIEREN</button>
            </div>
            <div class="row">
                <input type="text" id="targetCode" placeholder="Code vom Kolleg eingeben...">
                <button class="btn" onclick="connect()">VERBINDEN</button>
            </div>
        </div>

        <div class="chat-box" id="chatBox">
            <div class="msg sys">Chat bereit. Gib den Code ein und drücke Verbinden!</div>
        </div>

        <div class="input-bar">
            <input type="text" id="chatInput" placeholder="Nachricht schreiben..." onkeypress="if(event.key==='Enter') send()">
            <button class="send-btn" onclick="send()">➤</button>
        </div>
    </div>

    <script>
        const myID = Math.floor(100000 + Math.random() * 900000).toString();
        let targetID = "";
        document.getElementById('myCode').value = "DEIN CODE: " + myID;

        // Ultra-Fast Global Broadcast Tunnel (< 0.5s Reaktionszeit)
        function listenForMessages() {
            const es = new EventSource(`https://ntfy.sh/nullsec_channel_${myID}/sse`);
            es.onmessage = (e) => {
                try {
                    const data = JSON.parse(e.data);
                    if (data.message) {
                        const parsed = JSON.parse(data.message);
                        if (parsed.sender !== myID) {
                            addMsg(parsed.text, 'peer');
                        }
                    }
                } catch(err) {}
            };
        }

        function connect() {
            const input = document.getElementById('targetCode').value.trim();
            if(input.length < 6) return alert("Gib den 6-stelligen Code ein!");
            targetID = input;
            document.getElementById('status').innerText = "VERBUNDEN MIT #" + targetID;
            addMsg(`Verbindung zu #${targetID} steht!`, 'sys');
        }

        function send() {
            const input = document.getElementById('chatInput');
            const txt = input.value.trim();
            if(!txt) return;

            if(!targetID) {
                alert("Gib oben erst den Code von deinem Kumpel ein!");
                return;
            }

            // Garantiert unter 1 Sekunde bei beiden Handys
            fetch(`https://ntfy.sh/nullsec_channel_${targetID}`, {
                method: 'POST',
                body: JSON.stringify({ sender: myID, text: txt })
            });

            addMsg(txt, 'me');
            input.value = '';
        }

        function addMsg(text, type) {
            const box = document.getElementById('chatBox');
            const div = document.createElement('div');
            div.className = `msg ${type}`;
            div.innerText = text;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        function copyCode() {
            navigator.clipboard.writeText(myID);
            alert("Dein Code wurde kopiert!");
        }

        listenForMessages();
    </script>
</body>
</html>
