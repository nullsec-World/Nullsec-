<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>#NULLSEC • Ultra Fast P2P</title>
    
    <!-- PeerJS Framework -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <style>
        :root {
            --bg: #030712;
            --card-bg: rgba(15, 23, 42, 0.75);
            --accent: #00ffcc;
            --accent-glow: rgba(0, 255, 204, 0.25);
            --accent-dim: rgba(0, 255, 204, 0.08);
            --danger: #ff3366;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
            --font-mono: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-image: 
                radial-gradient(circle at 50% 0%, var(--accent-glow) 0%, transparent 60%),
                radial-gradient(circle at 100% 100%, rgba(59, 130, 246, 0.1) 0%, transparent 50%);
            background-attachment: fixed;
        }

        .app-container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px var(--accent-glow);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 20px;
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .brand-title {
            font-family: var(--font-mono);
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: 2px;
            text-shadow: 0 0 12px var(--accent-glow);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.65rem;
            color: var(--accent);
            background: var(--accent-dim);
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid rgba(0, 255, 204, 0.3);
            font-family: var(--font-mono);
            font-weight: 600;
        }

        .pulse-dot {
            width: 7px;
            height: 7px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent);
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        .card {
            background: rgba(2, 6, 23, 0.6);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card-title {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            font-family: var(--font-mono);
            font-weight: 700;
        }

        .code-display {
            font-family: var(--font-mono);
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: 6px;
            text-align: center;
            text-shadow: 0 0 15px var(--accent-glow);
            padding: 8px 0;
            background: rgba(0, 255, 204, 0.03);
            border-radius: 12px;
            border: 1px dashed rgba(0, 255, 204, 0.2);
        }

        .input-group {
            display: flex;
            gap: 8px;
        }

        input[type="text"] {
            flex: 1;
            background: rgba(2, 6, 23, 0.9);
            border: 1px solid var(--border);
            padding: 12px 16px;
            border-radius: 12px;
            color: var(--accent);
            font-family: var(--font-mono);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .btn {
            background: var(--accent);
            color: #030712;
            border: none;
            padding: 12px 18px;
            border-radius: 12px;
            font-weight: 800;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.15s ease-in-out;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }

        .btn:hover {
            box-shadow: 0 0 20px var(--accent-glow);
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            box-shadow: none;
        }

        .btn-danger {
            background: var(--danger);
            color: #fff;
        }

        .btn-danger:hover {
            box-shadow: 0 0 15px rgba(255, 51, 102, 0.4);
        }

        .btn-full {
            width: 100%;
        }

        .media-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .video-wrapper {
            position: relative;
            aspect-ratio: 4/3;
            background: #000;
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-tag {
            position: absolute;
            bottom: 6px;
            left: 6px;
            font-size: 0.6rem;
            font-family: var(--font-mono);
            background: rgba(0, 0, 0, 0.7);
            padding: 2px 8px;
            border-radius: 6px;
            color: var(--accent);
            backdrop-filter: blur(4px);
        }

        .chat-box {
            height: 140px;
            background: rgba(2, 6, 23, 0.8);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-family: var(--font-mono);
            font-size: 0.75rem;
        }

        .chat-msg {
            padding: 6px 10px;
            border-radius: 8px;
            word-break: break-word;
            line-height: 1.3;
        }

        .chat-msg.me {
            background: var(--accent-dim);
            color: var(--accent);
            align-self: flex-end;
            border: 1px solid rgba(0, 255, 204, 0.2);
        }

        .chat-msg.peer {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            align-self: flex-start;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .chat-msg.system {
            color: var(--text-muted);
            font-style: italic;
            font-size: 0.7rem;
            text-align: center;
            background: transparent;
        }

        .app-footer {
            text-align: center;
            font-size: 0.6rem;
            font-family: var(--font-mono);
            color: var(--text-muted);
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header class="app-header">
            <div class="brand-title">#NULLSEC</div>
            <div class="status-badge">
                <div class="pulse-dot"></div>
                RAM-ONLY / P2P
            </div>
        </header>

        <!-- CODE GENERATOR -->
        <div class="card">
            <div class="card-title">DEINE ANONYME VERBINDUNGS-ID</div>
            <div class="code-display" id="myPeerId">------</div>
            <button class="btn btn-secondary btn-full" onclick="initPeer()">ID NEU GENERIEREN 🔄</button>
        </div>

        <!-- CONNECT BOX -->
        <div class="card">
            <div class="card-title">BLITZ-VERBINDUNG</div>
            <div class="input-group">
                <input type="text" id="targetPeerId" placeholder="6-Stelligen Code eingeben..." maxlength="6">
                <button class="btn" onclick="connectToPeer()">VERBINDEN</button>
            </div>
        </div>

        <!-- MEDIA / CALLS -->
        <div class="card">
            <div class="card-title">PEER-TO-PEER MEDIA</div>
            <div class="media-grid">
                <div class="video-wrapper">
                    <video id="localVideo" autoplay muted playsinline></video>
                    <div class="video-tag">DU</div>
                </div>
                <div class="video-wrapper">
                    <video id="remoteVideo" autoplay playsinline></video>
                    <div class="video-tag">PARTNER</div>
                </div>
            </div>
            <div class="input-group" style="margin-top: 6px;">
                <button class="btn btn-full" onclick="startCall(true)">📹 VIDEO</button>
                <button class="btn btn-full" onclick="startCall(false)">📞 AUDIO</button>
                <button class="btn btn-danger" onclick="hangUp()">❌</button>
            </div>
        </div>

        <!-- CHAT -->
        <div class="card">
            <div class="card-title">FLÜCHTIGER RAM-CHAT</div>
            <div class="chat-box" id="chatBox">
                <div class="chat-msg system">System: Ultra-Fast High Priority Tunnel bereit.</div>
            </div>
            <div class="input-group">
                <input type="text" id="chatInput" placeholder="Nachricht eingeben..." onkeypress="if(event.key==='Enter') sendChatMessage()">
                <button class="btn" onclick="sendChatMessage()">SENDEN</button>
            </div>
        </div>

        <footer class="app-footer">
            E2E ENCRYPTED • ZERO LOGS • DIRECT P2P TUNNEL
        </footer>
    </div>

    <script>
        // ZERO-STORAGE GUARANTEE: Blockiert dauerhaftes Speichern auf dem Handy
        try {
            window.localStorage.clear();
            window.sessionStorage.clear();
            Storage.prototype.setItem = function() {};
        } catch(e) {}

        let peer = null;
        let dataConn = null;
        let mediaCall = null;
        let localStream = null;

        // Blitz-Verbindung über Google & Cloudflare STUN Server
        function initPeer() {
            if(peer) peer.destroy();
            
            const randomCode = Math.floor(100000 + Math.random() * 900000).toString();
            const fullId = "nullsec-" + randomCode;
            
            peer = new Peer(fullId, {
                debug: 0,
                config: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' },
                        { urls: 'stun:stun2.l.google.com:19302' },
                        { urls: 'stun:stun.cloudflare.com:3478' }
                    ],
                    iceCandidatePoolSize: 10 // Vorab-Verbindungs-Pool für Highspeed
                }
            });

            peer.on('open', (id) => {
                document.getElementById('myPeerId').innerText = randomCode;
                logSystem(`Sicherer Tunnel bereit. Code: ${randomCode}`);
            });

            peer.on('connection', (conn) => {
                dataConn = conn;
                setupChatListeners();
                logSystem("BLITZ-VERBINDUNG HERGESTELLT!");
            });

            peer.on('call', async (call) => {
                const acceptCall = confirm("Eingehender Anruf! Annehmen?");
                if (acceptCall) {
                    try {
                        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                        document.getElementById('localVideo').srcObject = localStream;
                        call.answer(localStream);
                        
                        call.on('stream', (remoteStream) => {
                            document.getElementById('remoteVideo').srcObject = remoteStream;
                        });
                        mediaCall = call;
                        logSystem("Anruf aktiv!");
                    } catch(err) {
                        alert("Kamera/Mikrofon Zugriff verweigert.");
                    }
                }
            });

            peer.on('error', (err) => {
                logSystem(`Status: Verbindungs-Update...`);
            });
        }

        // Direktes Verbinden (Unter 1 Sekunde)
        function connectToPeer() {
            const inputVal = document.getElementById('targetPeerId').value.trim();
            if(!inputVal || inputVal.length < 6) return alert("Gib den 6-stelligen Code ein!");

            const fullTargetId = "nullsec-" + inputVal;
            logSystem(`Verbinde blitzschnell zu ${inputVal}...`);
            
            dataConn = peer.connect(fullTargetId, { reliable: true });
            setupChatListeners();
        }

        function setupChatListeners() {
            dataConn.on('open', () => {
                logSystem("Tunnel aktiv! Kommunikation verschlüsselt.");
            });

            dataConn.on('data', (data) => {
                addChatBubble(data, 'peer');
            });

            dataConn.on('close', () => {
                logSystem("Verbindung getrennt. Speicher gesäubert.");
            });
        }

        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if(!msg) return;

            if(dataConn && dataConn.open) {
                dataConn.send(msg);
                addChatBubble(msg, 'me');
                input.value = '';
            } else {
                alert("Erst Code eingeben und 'Verbinden' drücken!");
            }
        }

        function addChatBubble(text, sender) {
            const box = document.getElementById('chatBox');
            const div = document.createElement('div');
            div.className = `chat-msg ${sender}`;
            div.innerText = text;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        function logSystem(text) {
            const box = document.getElementById('chatBox');
            const div = document.createElement('div');
            div.className = 'chat-msg system';
            div.innerText = `[SYS] ${text}`;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        async function startCall(withVideo) {
            const inputVal = document.getElementById('targetPeerId').value.trim();
            if(!inputVal) return alert("Gib erst den Code deines Freundes ein!");

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    video: withVideo, 
                    audio: true 
                });
                document.getElementById('localVideo').srcObject = localStream;

                const fullTargetId = "nullsec-" + inputVal;
                mediaCall = peer.call(fullTargetId, localStream);

                mediaCall.on('stream', (remoteStream) => {
                    document.getElementById('remoteVideo').srcObject = remoteStream;
                });

                logSystem("Anruf wird aufgebaut...");
            } catch(err) {
                alert("Kamera oder Mikrofon konnte nicht gestartet werden.");
            }
        }

        function hangUp() {
            if(mediaCall) mediaCall.close();
            if(localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }
            document.getElementById('localVideo').srcObject = null;
            document.getElementById('remoteVideo').srcObject = null;
            logSystem("Anruf beendet.");
        }

        window.addEventListener('DOMContentLoaded', () => {
            initPeer();
        });
    </script>
</body>
</html>
