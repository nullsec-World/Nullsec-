<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- RAM-ONLY SECURITY: Keinerlei Caching erlaubt -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>#NULLSEC • Hyper-Fast P2P Encrypted Terminal</title>
    
    <!-- PeerJS Framework & QR Code Generator -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        /* ==========================================================================
           CYBERPUNK NEON ULTRA STYLING (DESIGN SYSTEM)
           ========================================================================== */
        :root {
            --bg-dark: #020617;
            --panel-bg: rgba(15, 23, 42, 0.85);
            --panel-border: rgba(0, 255, 204, 0.2);
            --neon-green: #00ffcc;
            --neon-glow: rgba(0, 255, 204, 0.35);
            --neon-dim: rgba(0, 255, 204, 0.08);
            --neon-red: #ff0055;
            --neon-blue: #00bfff;
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --font-mono: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-image: 
                linear-gradient(rgba(0, 255, 204, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 204, 0.03) 1px, transparent 1px),
                radial-gradient(circle at 50% 0%, var(--neon-glow) 0%, transparent 75%);
            background-size: 30px 30px, 30px 30px, 100% 100%;
            background-attachment: fixed;
            overflow-x: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 28px;
            box-shadow: 0 0 50px rgba(0, 255, 204, 0.15), inset 0 0 20px rgba(0, 255, 204, 0.05);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 24px;
            position: relative;
        }

        .app-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-green), transparent);
            animation: scanline 4s linear infinite;
        }

        @keyframes scanline {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .brand-title {
            font-family: var(--font-mono);
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--neon-green);
            letter-spacing: 3px;
            text-shadow: 0 0 15px var(--neon-glow);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.65rem;
            color: var(--neon-green);
            background: var(--neon-dim);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(0, 255, 204, 0.3);
            font-family: var(--font-mono);
            font-weight: 700;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background: var(--neon-green);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--neon-green);
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        .card {
            background: rgba(2, 6, 23, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: border-color 0.3s ease;
        }

        .card:hover {
            border-color: rgba(0, 255, 204, 0.3);
        }

        .card-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            font-family: var(--font-mono);
            font-weight: 700;
        }

        .code-display-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .code-display {
            font-family: var(--font-mono);
            font-size: 2.4rem;
            font-weight: 900;
            color: var(--neon-green);
            letter-spacing: 8px;
            text-align: center;
            text-shadow: 0 0 20px var(--neon-glow);
            padding: 10px;
            width: 100%;
            background: rgba(0, 255, 204, 0.03);
            border-radius: 14px;
            border: 1px dashed rgba(0, 255, 204, 0.25);
        }

        #qrcode {
            background: #fff;
            padding: 10px;
            border-radius: 12px;
            display: none;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            background: rgba(2, 6, 23, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px 18px;
            border-radius: 14px;
            color: var(--neon-green);
            font-family: var(--font-mono);
            font-size: 1rem;
            outline: none;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus {
            border-color: var(--neon-green);
            box-shadow: 0 0 15px var(--neon-glow);
        }

        .btn {
            background: var(--neon-green);
            color: #020617;
            border: none;
            padding: 14px 20px;
            border-radius: 14px;
            font-weight: 900;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            box-shadow: 0 0 25px var(--neon-glow);
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: none;
        }

        .btn-danger {
            background: var(--neon-red);
            color: #fff;
        }

        .btn-danger:hover {
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.5);
        }

        .btn-full {
            width: 100%;
        }

        .media-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .video-wrapper {
            position: relative;
            aspect-ratio: 4/3;
            background: #000;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-tag {
            position: absolute;
            bottom: 8px;
            left: 8px;
            font-size: 0.65rem;
            font-family: var(--font-mono);
            background: rgba(0, 0, 0, 0.8);
            padding: 3px 10px;
            border-radius: 8px;
            color: var(--neon-green);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(0, 255, 204, 0.2);
        }

        .chat-box {
            height: 160px;
            background: rgba(2, 6, 23, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-family: var(--font-mono);
            font-size: 0.8rem;
        }

        .chat-msg {
            padding: 8px 12px;
            border-radius: 10px;
            word-break: break-word;
            line-height: 1.4;
        }

        .chat-msg.me {
            background: var(--neon-dim);
            color: var(--neon-green);
            align-self: flex-end;
            border: 1px solid rgba(0, 255, 204, 0.25);
        }

        .chat-msg.peer {
            background: rgba(0, 191, 255, 0.12);
            color: var(--neon-blue);
            align-self: flex-start;
            border: 1px solid rgba(0, 191, 255, 0.25);
        }

        .chat-msg.system {
            color: var(--text-muted);
            font-style: italic;
            font-size: 0.72rem;
            text-align: center;
            background: transparent;
        }

        .app-footer {
            text-align: center;
            font-size: 0.65rem;
            font-family: var(--font-mono);
            color: var(--text-muted);
            letter-spacing: 1.5px;
            padding-top: 8px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- HEADER -->
        <header class="app-header">
            <div class="brand-title">#NULLSEC</div>
            <div class="status-badge">
                <div class="pulse-dot"></div>
                RAM-ONLY / P2P
            </div>
        </header>

        <!-- CODE GENERATOR & QR -->
        <div class="card">
            <div class="card-title">DEINE ANONYME VERBINDUNGS-ID</div>
            <div class="code-display-box">
                <div class="code-display" id="myPeerId">------</div>
                <div id="qrcode"></div>
            </div>
            <div style="display: flex; gap: 8px;">
                <button class="btn btn-secondary btn-full" onclick="copyFastLink()">⚡ LINK KOPIEREN</button>
                <button class="btn btn-secondary" onclick="toggleQR()">📱 QR</button>
            </div>
        </div>

        <!-- FAST CONNECT -->
        <div class="card">
            <div class="card-title">BLITZ-VERBINDUNG</div>
            <div class="input-group">
                <input type="text" id="targetPeerId" placeholder="6-Stelligen Code eingeben..." maxlength="6">
                <button class="btn" onclick="connectToPeer()">VERBINDEN</button>
            </div>
        </div>

        <!-- MEDIA CALLS -->
        <div class="card">
            <div class="card-title">REALTIME MEDIA STREAM</div>
            <div class="media-grid">
                <div class="video-wrapper">
                    <video id="localVideo" autoplay muted playsinline></video>
                    <div class="video-tag">DU</div>
                </div>
                <div class="video-wrapper">
                    <video id="remoteVideo" autoplay playsinline></video>
                    <div class="video-tag">PARTNER</div>
                </div>
            </div>
            <div class="input-group" style="margin-top: 8px;">
                <button class="btn btn-full" onclick="startCall(true)">📹 VIDEO</button>
                <button class="btn btn-full" onclick="startCall(false)">📞 AUDIO</button>
                <button class="btn btn-danger" onclick="hangUp()">❌</button>
            </div>
        </div>

        <!-- RAM CHAT -->
        <div class="card">
            <div class="card-title">FLÜCHTIGER RAM-CHAT</div>
            <div class="chat-box" id="chatBox">
                <div class="chat-msg system">System: High-Speed Direct Tunnel initialisiert.</div>
            </div>
            <div class="input-group">
                <input type="text" id="chatInput" placeholder="Nachricht eingeben..." onkeypress="if(event.key==='Enter') sendChatMessage()">
                <button class="btn" onclick="sendChatMessage()">SENDEN</button>
            </div>
        </div>

        <!-- FOOTER -->
        <footer class="app-footer">
            E2E ENCRYPTED • ZERO LOGS • DIRECT P2P TUNNEL
        </footer>
    </div>

    <!-- ==========================================================================
       JAVASCRIPT LOGIC & HIGH-SPEED NETWORKING
       ========================================================================== -->
    <script>
        // STRICT ZERO-STORAGE GUARANTEE (Blockiert Speicherzugriffe im Browser)
        try {
            window.localStorage.clear();
            window.sessionStorage.clear();
            Storage.prototype.setItem = function() {};
            Storage.prototype.getItem = function() { return null; };
        } catch(e) {}

        let peer = null;
        let dataConn = null;
        let mediaCall = null;
        let localStream = null;

        // Auto-Initialization mit High-Speed ICE Candidate Tuning
        function initPeer() {
            if(peer) peer.destroy();
            
            // Hash aus der URL auslesen (#nullsec-XXXXXX)
            const urlHash = window.location.hash.replace('#', '');
            const randomCode = (urlHash && urlHash.includes('nullsec-')) 
                ? urlHash.replace('nullsec-', '') 
                : Math.floor(100000 + Math.random() * 900000).toString();
                
            const fullId = "nullsec-" + randomCode;
            
            peer = new Peer(fullId, {
                debug: 0,
                config: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' },
                        { urls: 'stun:stun2.l.google.com:19302' },
                        { urls: 'stun:stun.cloudflare.com:3478' }
                    ],
                    iceCandidatePoolSize: 10
                }
            });

            peer.on('open', (id) => {
                document.getElementById('myPeerId').innerText = randomCode;
                generateQRCode(randomCode);
                logSystem(`Sicherer RAM-Tunnel aktiv. Code: ${randomCode}`);

                // Auto-Connect Trigger bei Direkt-Link
                if (urlHash && urlHash !== fullId && urlHash.startsWith('nullsec-')) {
                    const targetCode = urlHash.replace('nullsec-', '');
                    document.getElementById('targetPeerId').value = targetCode;
                    logSystem(`Blitz-Link erkannt! Verbinde zu ${targetCode}...`);
                    setTimeout(() => connectToPeer(), 300);
                }
            });

            peer.on('connection', (conn) => {
                dataConn = conn;
                setupChatListeners();
                logSystem("⚡ BLITZ-VERBINDUNG HERGESTELLT!");
            });

            peer.on('call', async (call) => {
                const acceptCall = confirm("Eingehender Anruf! Annehmen?");
                if (acceptCall) {
                    try {
                        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                        document.getElementById('localVideo').srcObject = localStream;
                        call.answer(localStream);
                        
                        call.on('stream', (remoteStream) => {
                            document.getElementById('remoteVideo').srcObject = remoteStream;
                        });
                        mediaCall = call;
                        logSystem("Anruf aktiv!");
                    } catch(err) {
                        alert("Zugriff auf Kamera/Mikrofon verweigert.");
                    }
                }
            });

            peer.on('error', (err) => {
                logSystem(`Verbindungs-Status: Suche Partner...`);
            });
        }

        // Blitz-Verbindung aufbauen
        function connectToPeer() {
            const inputVal = document.getElementById('targetPeerId').value.trim();
            if(!inputVal || inputVal.length < 6) return alert("Gib den 6-stelligen Code ein!");

            const fullTargetId = "nullsec-" + inputVal;
            logSystem(`Verbinde zu ${inputVal}...`);
            
            dataConn = peer.connect(fullTargetId, { reliable: true });
            setupChatListeners();
        }

        function setupChatListeners() {
            dataConn.on('open', () => {
                logSystem("⚡ Tunnel aktiv! Kommunikation läuft live über RAM.");
            });

            dataConn.on('data', (data) => {
                addChatBubble(data, 'peer');
            });

            dataConn.on('close', () => {
                logSystem("Verbindung getrennt.");
            });
        }

        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if(!msg) return;

            if(dataConn && dataConn.open) {
                dataConn.send(msg);
                addChatBubble(msg, 'me');
                input.value = '';
            } else {
                alert("Erst Code eingeben und 'Verbinden' drücken!");
            }
        }

        function addChatBubble(text, sender) {
            const box = document.getElementById('chatBox');
            const div = document.createElement('div');
            div.className = `chat-msg ${sender}`;
            div.innerText = text;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        function logSystem(text) {
            const box = document.getElementById('chatBox');
            const div = document.createElement('div');
            div.className = `chat-msg system`;
            div.innerText = `[SYS] ${text}`;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        // Link mit Auto-Connect kopieren
        function copyFastLink() {
            const currentCode = document.getElementById('myPeerId').innerText;
            if(currentCode === '------') return;
            
            const fastUrl = window.location.origin + window.location.pathname + '#nullsec-' + currentCode;
            navigator.clipboard.writeText(fastUrl);
            alert("⚡ Blitz-Link kopiert! Sobald dein Kumpel den Link öffnet, verbindet ihr euch sofort.");
        }

        // QR Code Generator & Toggle
        function generateQRCode(code) {
            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = '';
            const fastUrl = window.location.origin + window.location.pathname + '#nullsec-' + code;
            new QRCode(qrContainer, {
                text: fastUrl,
                width: 128,
                height: 128
            });
        }

        function toggleQR() {
            const qr = document.getElementById('qrcode');
            qr.style.display = (qr.style.display === 'block') ? 'none' : 'block';
        }

        // Realtime Video / Audio Calls
        async function startCall(withVideo) {
            const inputVal = document.getElementById('targetPeerId').value.trim();
            if(!inputVal) return alert("Gib erst den Code deines Freundes ein!");

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    video: withVideo, 
                    audio: true 
                });
                document.getElementById('localVideo').srcObject = localStream;

                const fullTargetId = "nullsec-" + inputVal;
                mediaCall = peer.call(fullTargetId, localStream);

                mediaCall.on('stream', (remoteStream) => {
                    document.getElementById('remoteVideo').srcObject = remoteStream;
                });

                logSystem("Anruf wird aufgebaut...");
            } catch(err) {
                alert("Kamera oder Mikrofon konnte nicht gestartet werden.");
            }
        }

        function hangUp() {
            if(mediaCall) mediaCall.close();
            if(localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }
            document.getElementById('localVideo').srcObject = null;
            document.getElementById('remoteVideo').srcObject = null;
            logSystem("Anruf beendet.");
        }

        // App Start
        window.addEventListener('DOMContentLoaded', () => {
            initPeer();
        });
    </script>
</body>
</html>
